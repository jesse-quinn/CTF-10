server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html/gallery;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The originals are served as a browsable directory so visitors can pull the
    # full-resolution exports.
    location /images/ {
        autoindex on;
    }
}
